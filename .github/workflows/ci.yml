name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Translations (en.json up to date, all languages complete, same tags and numbers)
        run: npm run i18n:check
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Size budget
        run: npm run size
      - name: Screens (Playwright, 7 languages, phone and desktop, light and dark)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: test-results
          retention-days: 14
